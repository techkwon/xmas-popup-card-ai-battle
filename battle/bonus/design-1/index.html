<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17110e; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; cursor: pointer; }
  .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font: 22px/1.2 "Nanum Pen Script", cursive;
          color: #fff3dc; opacity: .82; letter-spacing: .02em; pointer-events: none; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); white-space: nowrap; }
  @media (max-width: 720px) { .hint { bottom: 70px; font-size: 19px; } }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 30px/1.2 "Nanum Pen Script", cursive;
             color: #f3e3c4; background: #17110e; transition: opacity .5s; pointer-events: none; }
  .loading.done { opacity: 0; }
</style>

<div id="stage"></div>
<div class="loading" id="loading">카드를 준비하고 있어요…</div>
<div class="hint" id="hint">카드를 누르면 처음부터 다시 펼쳐져요</div>

const ROWS = [{"eng": "astra", "model": "gpt-6.2-astra", "design": "design-1", "href": "astra/design-1/index.html", "video": "videos/astra-design-1.mp4", "poster": "videos/astra-design-1.jpg", "notes": "성탄 전야의 《호두까기 인형》을 금박 테두리와 석류빛 종이 커튼이 있는 장난감 극장으로 만들었다.\n표지가 직각으로 열리면 평행 접지로 연결된 무대문과 전나무, 두 배우가 차례로 모습을 드러낸다.\n어깨의 종이 핀을 축으로 병정은 북채를 번갈아 두드리고 발레리나는 팔과 다리를 들어 올린다.\n별과 눈송이를 찍은 밤하늘 원판은 천천히 돌고, 앞쪽의 절취선 있는 관람권에는 편지가 적힌다."}, {"eng": "astra", "model": "gpt-6.2-astra", "design": "design-2", "href": "astra/design-2/index.html", "video": "videos/astra-design-2.mp4", "poster": "videos/astra-design-2.jpg", "notes": "산타 모자를 쓴 고래 비행선이 눈 덮인 북극 해협을 건너 크리스마스 편지를 배달한다.\n항로도 책이 180도로 펼쳐지며 책등의 사선 접지 두 쌍이 고래 몸체와 뒤편 등대를 세운다.\n꼬리의 줄무늬 프로펠러는 핀을 중심으로 돌고, 산타의 곤돌라는 평행한 종이 띠 두 개에 매달려 흔들린다.\n지느러미와 꼬리 아래 별들이 흔들리는 동안 앞쪽 항공 서신에는 받는 이와 본문, 보낸 이가 함께 보인다."}, {"eng": "bonus", "model": "claude-fable-5-2", "design": "design-1", "href": "bonus/design-1/index.html", "video": "videos/bonus-design-1.mp4", "poster": "videos/bonus-design-1.jpg", "notes": "북극성 우체국의 크리스마스이브 — 바닥(ground.png)과 뒷벽(backdrop.png, 바깥은 cover.png 표지)이 접선 하나로 이어진 90도 팝업 카드입니다.\n구조: 모든 그림 조각은 벽과 평행을 유지하는 평행 접기(벽으로 가는 종이 띠, 또는 뒷다리+띠 받침) 위에 서서 벽과 함께 앞으로 접혔다 일어나고, 뒷면에도 그림이 거울상으로 인쇄돼 있으며, 큰 트리는 가운데 접선에서 날개 두 장이 펼쳐집니다.\n움직임: 벽은 90도를 살짝 넘겼다 돌아오고 조각은 앞줄일수록 한 박자 늦게 파르르 떨며 섭니다. 그 뒤 썰매가 별빛 레일(하늘에 띄운 종이 띠)을 타고 달 쪽으로 오르고, 눈사람은 얼음 연못의 슬롯을 따라 미끄러지며, 창불이 하나둘 켜지고 굴뚝 연기와 종이 눈이 내립니다.\n메시지: 달과 별 사이에 붙인 항공우편 편지지에 받는 사람·내용·보내는 사람을 손글씨(Nanum Pen Script)로 인쇄하고, 긴 글은 자동으로 줄바꿈하며 글씨를 줄여 편지지 안에 넣습니다.\n캡처: 모든 자세가 시계 값 하나의 순수 함수라 restart() 뒤 step(sec)가 늘 같은 프레임을 그리며(?capture, ?size=WxH, window.__papercraft), 카드는 0~10초 내내 16:9 프레임 안에 있습니다. 파일은 main.js(무대·빛·카메라·시계), card.js(카드와 종이 기구), letter.js(편지·표지·탁자 인쇄), life.js(눈·연기)입니다."}, {"eng": "carbon", "model": "gemini-4-carbon-high", "design": "design-1", "href": "carbon/design-1/index.html", "video": "videos/carbon-design-1.mp4", "poster": "videos/carbon-design-1.jpg", "notes": "# 별빛 산타 공방의 크리스마스 이브 (design-1)\n- **콘셉트**: 호두나무 테이블 위에 놓인 크림슨·앤티크 골드 표지의 크리스마스 카드가 열리며, 눈 덮인 산타 장난감 공방과 시계탑 광장의 따뜻한 성탄 전야 풍경이 펼쳐집니다.\n- **카드 구조**: 가로 접기선을 따라 90도로 세워지는 L자형 배경벽 팝업 카드(90-degree stage card)와 다단 평행사변형 스텝 폴드(parallelogram step-folds), 슬롯 교차 트리 구조를 결합해 닫혔을 때 모든 종이 부품이 카드 안쪽에 완전히 평평하게 수납됩니다.\n- **작동 메커니즘**: 아치형 창 뒤에서 브래드 핀으로 회전하는 별자리 볼벨(volvelle) 원판, 하늘 곡선 슬롯을 따라 왕복 비행하는 산타 썰매와 루돌프, 석조 고가교 수평 슬롯과 연동 당김 탭으로 달리는 장난감 증기기관차, 시계탑 바람개비 및 흔들목마 진자가 내리는 종이 눈송이·굴뚝 연기와 함께 계속 움직입니다."}, {"eng": "carbon", "model": "gemini-4-carbon-high", "design": "design-2", "href": "carbon/design-2/index.html", "video": "videos/carbon-design-2.mp4", "poster": "videos/carbon-design-2.jpg", "notes": "# 고요한 밤, 숲속 호수의 성탄 회전목마 (design-2)\n- **콘셉트**: 미드나잇 인디고와 샴페인 실버 양장 표지의 팝업북이 좌우로 펼쳐지며, 달빛 어린 북유럽 눈숲 예배당과 얼음 호수, 성탄 트리 회전목마가 어우러진 고요한 성탄야가 나타납니다.\n- **카드 구조**: 세로 책등(spine)을 중심으로 180도로 완전히 펼쳐지는 하드커버 북 스프레드(180-degree book spread) 구조로, 중앙 접기선을 가로지르는 강체 V-폴드(V-fold) 설산 아치와 중앙 4면 입체 파빌리온, 당김 스트랩 연동 좌우 페이지 플랩으로 구성됩니다.\n- **작동 메커니즘**: 중앙 회전축을 따라 도는 성탄 트리와 네 마리 순록 회전목마, 오른쪽 얼음 호수의 타원형 컷아웃 슬롯을 따라 활주하는 스케이터 커플, 설산 원형 창 뒤에서 회전하는 초승달·별자리 볼벨 디스크, 흔들리는 별 등불 진자가 눈송이·금빛 반딧불 입자와 함께 움직입니다."}, {"eng": "fable", "model": "claude-fable-5-2", "design": "design-1", "href": "fable/design-1/index.html", "video": "videos/fable-design-1.mp4", "poster": "videos/fable-design-1.jpg", "notes": "# 달빛 썰매 (Design 1)\n\n- **콘셉트**: 눈 내린 크리스마스 밤 마을. 표지가 세워지면 밤하늘이 되고, 커다란 보름달 위로 산타 썰매가 지나가며, 육교 위로 기차가 달립니다. 팔레트는 남색 밤하늘·달빛 크림·창문 금빛·눈의 푸른 흰색.\n- **카드 구조**: 뒷벽이 있는 90도 팝업 카드(36×16.4cm 두 면). 마을·육교·터널 언덕·눈밭 편지판 네 줄이 뒷벽과 평행한 평행 접기(패럴렐 폴드)로 서고, 종이 띠가 앞뒤 줄을 이어 줍니다. 하나의 접힘 각도가 모든 경첩을 움직입니다.\n- **움직이는 장치**: ① 달 한가운데 핀에 꽂힌 회전 팔 끝에서 산타 썰매가 달 위를 돕니다(핀 스피너). ② 육교 난간의 긴 슬롯을 따라 기차가 터널에서 나와 건너갔다 돌아옵니다(슬롯 슬라이더). 여기에 종이 눈과 굴뚝·기관차의 종이 연기가 더해집니다.\n- **메시지**: 받는 사람은 눈사람이 든 왼쪽 꼬리표, 본문은 가운데 편지판, 보내는 사람은 가로등 옆 오른쪽 꼬리표에 손글씨로 인쇄되며, 길면 줄바꿈하고 글자를 줄여 맞춥니다."}, {"eng": "fable", "model": "claude-fable-5-2", "design": "design-2", "href": "fable/design-2/index.html", "video": "videos/fable-design-2.mp4", "poster": "videos/fable-design-2.jpg", "notes": "# 트리 아래 장난감 (Design 2)\n\n- **콘셉트**: 책처럼 펼치면 선물 더미 앞에 크리스마스트리가 서고 곰 인형·흔들목마가 양옆을 지키는 아침 풍경. 팔레트는 크림 종이·크랜베리 빨강·전나무 초록·겨자 금색·민트.\n- **카드 구조**: 180도로 펼치는 책 형태(19×20cm 두 쪽)와 V-폴드. 가운데 골에 걸친 볼록 V-폴드 네 겹(선물 벽+트리 뒷단, 트리 두 단, 지팡이 사탕 리본)이 서고, 장난감과 화분 나무는 선물 벽과 평행한 평행 접기로 리본 띠에 묶여 섭니다. 뒤쪽 V일수록 더 뾰족하게 접어 닫힐 때 서로 뚫지 않습니다.\n- **움직이는 장치**: ① 트리 꼭대기 별이 핀 위에서 돕니다(스피너). ② 가지 끝 방울 여덟 개가 핀에 매달려 흔들립니다(스윙 암). ③ 흔들목마가 핀을 축으로 앞뒤로 흔들리고, 곰 인형의 팔이 북을 칩니다. 여기에 종이 눈이 내립니다.\n- **메시지**: 왼쪽 면 앞쪽의 편지지에 받는 사람·본문·보내는 사람이 손글씨로 인쇄되며, 길면 줄바꿈하고 글자를 줄여 맞춥니다."}, {"eng": "opus-test", "model": "claude-opus-5-5", "design": "design-1", "href": "opus-test/design-1/index.html", "video": "videos/opus-test-design-1.mp4", "poster": "videos/opus-test-design-1.jpg", "notes": "# 고요한 밤 마을 (Silent Night Village)\n\n- **콘셉트**: 남색 밤하늘 아래 눈 덮인 작은 마을. 창마다 불이 켜지고, 산타의 썰매가 달 쪽으로 하늘을 가로지릅니다. 남색·금색·은빛 눈의 밤 팔레트, 어두운 호두나무 테이블.\n- **카드 구조**: 90도 팝업 카드(바닥 + 뒷벽). 뒷벽이 덮개처럼 들리며 열리고, 다섯 장의 평행 레이어(먼 숲, 교회 마을, 광장 트리, 메시지 간판과 눈사람의 눈둑, 앞쪽 눈더미)가 바닥에 접혀 있다가 평행사변형 링크로 벽과 같은 각도로 일어섭니다. 닫히면 모두 카드 안에 납작하게 접힙니다.\n- **움직이는 장치**: 하늘의 홈(슬롯)을 따라 미끄러지는 산타 썰매(슬라이더), 종탑 안에서 핀에 매달려 흔들리는 종(진자), 광장 트리 꼭대기에서 도는 별(스피너), 손을 흔드는 눈사람 팔(브래드 핀). 종이 눈송이가 떨어져 눈밭에 내려앉습니다.\n- **메시지**: 받는 사람·메시지·보내는 사람이 눈둑 위 나무 간판의 종이 쪽지에 손글씨로 적히고, 긴 문장은 줄바꿈·축소됩니다."}, {"eng": "opus-test", "model": "claude-opus-5-5", "design": "design-2", "href": "opus-test/design-2/index.html", "video": "videos/opus-test-design-2.mp4", "poster": "videos/opus-test-design-2.jpg", "notes": "# 숲속의 크리스마스 (Christmas in the Snowy Wood)\n\n- **콘셉트**: 햇살 비치는 눈 숲 한가운데 장식된 큰 크리스마스 트리, 빨간 오두막, 썰매 타는 아이들과 스케이트 연못. 크림빛 눈·소나무 초록·진홍·금색의 낮 민속화 팔레트, 세이지색 테이블.\n- **카드 구조**: 180도로 펼쳐지는 책 모양 카드. 빨간 앞표지가 책등을 넘어가 평평하게 내려앉고, 접지선 위에 붙은 V-폴드 세 개(산등성이·오두막·썰매 언덕, 큰 트리와 접힌 별, 눈사람·전나무·여우)가 일어섭니다. 세 V-폴드는 같은 각도로 붙어 있어 열리는 내내 서로 평행하고 닿지 않으며, 주름선 방향을 페이지 각도로부터 정확히 계산합니다.\n- **움직이는 장치**: 언덕의 홈을 따라 내려갔다가 당겨 올라오는 썰매(풀탭 슬라이더), 트리 가지에 핀으로 매달려 흔들리는 장식 방울(진자), 창 아래에서 도는 스케이트 연못(볼벨). 종이 눈과 굴뚝 연기가 피어오릅니다.\n- **메시지**: 왼쪽 페이지에 붙은 사탕 줄무늬 편지지에 손글씨로 적히고, 긴 문장은 줄바꿈·축소됩니다."}];
const NAMES = { fable: 'Claude Fable 5.2', astra: 'GPT-6.2 Astra', carbon: 'Gemini 4 Carbon', bonus: '번외편 — Codex 그림 + Fable 코드', 'opus-test': '프롬프트 시험 — Claude Opus 5.5' };
const ORDER = ['fable', 'astra', 'carbon', 'bonus', 'opus-test'];
const g = document.getElementById('g');
const engs = [...new Set(ROWS.map(r => r.eng))].sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
for (const e of engs) {
  const s = document.createElement('section');
  const h = document.createElement('h2'); h.textContent = NAMES[e] || e; s.append(h);
  const row = document.createElement('div'); row.className = 'row';
  for (const r of ROWS.filter(x => x.eng === e)) {

    const v = document.createElement('video'); v.src = r.video; v.poster = r.poster; v.controls = true; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none';
    const m = document.createElement('div'); m.className = 'meta';
    const t = document.createElement('h3'); t.textContent = (r.notes.split('\n')[0] || r.design).replace(/^#\s*/, '');
    const a = document.createElement('a'); a.href = r.href; a.textContent = '카드 열기 (HTML)'; a.target = '_blank'; a.rel = 'noopener';
    const n = document.createElement('div'); n.className = 'notes'; const ls = r.notes.split('\n'); n.textContent = (ls[0].startsWith('#') ? ls.slice(1) : ls).join('\n').replace(/\*\*/g, '').trim();
    m.append(t, a, n); it.append(v, m); row.append(it);
  }
  s.append(row); g.append(s);
}
